<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="referrer" content="no-referrer">
    
    <title>Native Malayalam Voice Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Noto Sans Malayalam', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #eef2fa 0%, #dce5f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .main-card {
            max-width: 980px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 56px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(110, 140, 160, 0.2);
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .header {
            background: linear-gradient(115deg, #0a2b38, #1c5a6e);
            padding: 28px 32px;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 span {
            background: linear-gradient(135deg, #ffe5b4, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            background: rgba(255, 255, 200, 0.2);
            border-radius: 60px;
            display: inline-block;
            padding: 5px 14px;
            font-size: 0.7rem;
            margin-top: 10px;
            font-weight: 500;
        }

        .content {
            padding: 28px 32px 36px;
        }

        .text-area {
            margin-bottom: 30px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1f4e66;
        }

        textarea {
            width: 100%;
            border: 2px solid #cde0ea;
            border-radius: 32px;
            padding: 16px 20px;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            background: white;
            font-weight: 500;
        }

        textarea:focus {
            border-color: #2c7da0;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .example-btn {
            background: #eef2f7;
            border: none;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1d5e7c;
            cursor: pointer;
            transition: 0.2s;
        }

        .example-btn:hover {
            background: #dae7f0;
            transform: scale(0.96);
        }

        .controls-panel {
            background: #f8fbfe;
            border-radius: 48px;
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid #e2edf4;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #134b62;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-left: 5px solid #f4a261;
            padding-left: 18px;
        }

        .voice-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .voice-group {
            flex: 1;
            min-width: 160px;
        }

        .voice-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #4e788b;
            margin-bottom: 6px;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px 12px;
            border-radius: 48px;
            border: 1px solid #caddf0;
            background: white;
            cursor: pointer;
        }

        .value-hint {
            font-size: 0.7rem;
            background: #eef2f5;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 6px;
        }

        .button-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 24px 0 16px;
        }

        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #1e6f5c;
            color: white;
        }

        .btn-primary:hover {
            background: #0f5545;
        }

        .btn-download {
            background: #2a6b47;
            color: white;
        }

        .btn-stop {
            background: #b44332;
            color: white;
        }

        .recording-status {
            background: #eef3f7;
            border-radius: 48px;
            padding: 12px 20px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .status-text {
            font-size: 0.75rem;
            color: #2c6e8f;
            font-weight: 500;
        }

        .tech-note {
            font-size: 0.7rem;
            background: #fdf0ed;
            padding: 8px 14px;
            border-radius: 28px;
            margin-top: 20px;
            color: #b44332;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h1>🎙️ നേറ്റീവ് മലയാളം <span>Voice Player</span></h1>
        <div class="badge">⚡ സ്മാർട്ട് വോയിസ് എഞ്ചിൻ</div>
        <div class="badge">🔄 MP3 ഡൗൺലോഡ് സപ്പോർട്ട്</div>
    </div>

    <div class="content">
        <div class="text-area">
            <div class="label-row">
                <span>📝 മലയാളം വാചകം</span>
                <span class="status-text" id="charCount">0 characters</span>
            </div>
            <textarea id="malayalamText" rows="4" placeholder="ഇവിടെ മലയാളത്തിൽ എഴുതുക... സ്വാഭാവിക ശബ്ദത്തിൽ കേൾക്കാം (കുറഞ്ഞത് 200 അക്ഷരങ്ങൾ മാത്രം ഒരുമിച്ചു നൽകുക)"></textarea>
            <div class="examples">
                <button type="button" class="example-btn" data-text="നമസ്കാരം, ഞാൻ ഒരു മലയാളം സ്വാഭാവിക വോയിസ് ആണ്. എനിക്ക് വ്യക്തമായി സംസാരിക്കാം.">✨ ഉദാഹരണം 1</button>
                <button type="button" class="example-btn" data-text="കേരളത്തിന്റെ പ്രകൃതി ഭംഗിയും സംസ്കാരവും ലോകമറിയുന്നതാണ്. മലയാളം മധുരഭാഷ.">🌴 ഉദാഹരണം 2</button>
                <button type="button" class="example-btn" data-text="സാങ്കേതികവിദ്യ ഉപയോഗിച്ച് ശബ്ദം കേൾക്കാം. വളരെ എളുപ്പം.">🎧 ഉദാഹരണം 3</button>
            </div>
        </div>

        <div class="controls-panel">
            <div class="panel-title" id="engineTitle">
                🧠 AI Native Voice Engine
            </div>
            <div class="voice-row">
                <div class="voice-group">
                    <label>🗣️ വോയിസ് മോഡ്</label>
                    <select id="voiceSelect"></select>
                </div>
                <div class="voice-group">
                    <label>⚡ വേഗത (Rate)</label>
                    <input type="range" id="rateSlider" min="0.5" max="2" step="0.05" value="1.0">
                    <div class="value-hint" id="rateVal">1.00x</div>
                </div>
                <div class="voice-group">
                    <label>🎵 പിച്ച് (Pitch)</label>
                    <input type="range" id="pitchSlider" min="0.5" max="1.8" step="0.05" value="1.0">
                    <div class="value-hint" id="pitchVal">1.0</div>
                </div>
            </div>

            <div class="button-strip">
                <button id="speakAndRecordBtn" class="btn btn-primary">🎤 സംസാരിക്കുക</button>
                <button id="downloadBtn" class="btn btn-download">💾 MP3 ഡൗൺലോഡ്</button>
                <button id="stopBtn" class="btn btn-stop">⏹️ നിർത്തുക</button>
            </div>

            <div class="recording-status">
                <div id="statusMessage" class="status-text">പരിശോധിക്കുന്നു...</div>
            </div>
        </div>

        <div class="tech-note" id="warningNote" style="display:none;">
            ⚠️ നിങ്ങളുടെ ഡിവൈസിൽ സിസ്റ്റം മലയാളം വോയിസ് ലഭ്യമല്ല. അതിനാൽ ഓൺലൈൻ ക്ലൗഡ് ശബ്ദത്തിലേക്ക് തനിയെ മാറിയിട്ടുണ്ട്.
        </div>
    </div>
</div>

<audio id="audioPlayerFallback" style="display: none;"></audio>

<script>
    const textarea = document.getElementById('malayalamText');
    const charCountSpan = document.getElementById('charCount');
    const voiceSelect = document.getElementById('voiceSelect');
    const rateSlider = document.getElementById('rateSlider');
    const pitchSlider = document.getElementById('pitchSlider');
    const rateVal = document.getElementById('rateVal');
    const pitchVal = document.getElementById('pitchVal');
    const speakRecordBtn = document.getElementById('speakAndRecordBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('statusMessage');
    const warningNote = document.getElementById('warningNote');
    const engineTitle = document.getElementById('engineTitle');
    const fallbackPlayer = document.getElementById('audioPlayerFallback');

    let synthesis = window.speechSynthesis;
    let hasNativeMalayalam = false;

    function updateCharCount() {
        let len = textarea.value.length;
        charCountSpan.innerText = `${len} chars`;
        if (len > 200) charCountSpan.style.color = "#b44332";
        else charCountSpan.style.color = "#2c6e8f";
    }
    textarea.addEventListener('input', updateCharCount);
    updateCharCount();

    document.querySelectorAll('.example-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            textarea.value = btn.getAttribute('data-text');
            updateCharCount();
            statusDiv.innerText = "📝 ഉദാഹരണം ലോഡ് ചെയ്തു. 'സംസാരിക്കുക' ക്ലിക്ക് ചെയ്യുക.";
        });
    });

    function populateVoiceList() {
        let voices = synthesis.getVoices();
        voiceSelect.innerHTML = '';
        
        let mlVoices = voices.filter(v => v.lang.toLowerCase().includes('ml') || v.lang.toLowerCase().includes('malayalam'));
        
        if (mlVoices.length > 0) {
            hasNativeMalayalam = true;
            warningNote.style.display = 'none';
            engineTitle.innerText = "🧠 AI Native Voice Engine · സിസ്റ്റം വോയിസ്";
            
            mlVoices.forEach(v => {
                let option = document.createElement('option');
                option.value = 'native_' + v.name;
                option.textContent = `${v.name} (${v.lang}) 🎯`;
                voiceSelect.appendChild(option);
            });
            let cloudOption = document.createElement('option');
            cloudOption.value = 'online_female';
            cloudOption.textContent = 'Cloud Voice (Online MP3) 🌐';
            voiceSelect.appendChild(cloudOption);

        } else {
            hasNativeMalayalam = false;
            warningNote.style.display = 'block';
            engineTitle.innerText = "🌐 Cloud Voice Engine · ഓൺലൈൻ വഴി";
            
            let option = document.createElement('option');
            option.value = 'online_female';
            option.textContent = 'Malayalam Cloud Voice 🌐';
            voiceSelect.appendChild(option);
        }
        
        statusDiv.innerText = hasNativeMalayalam ? "✅ സിസ്റ്റം മലയാളം വോയിസ് തയ്യാറാണ്." : "ℹ️ ഓൺലൈൻ മലയാളം വോയിസ് മോഡ് സജീവമാക്കി.";
    }

    if (synthesis.onvoiceschanged !== undefined) {
        synthesis.onvoiceschanged = populateVoiceList;
    }
    // Give browser a moment to load voices
    setTimeout(populateVoiceList, 100);

    rateSlider.addEventListener('input', () => {
        rateVal.innerText = parseFloat(rateSlider.value).toFixed(2) + 'x';
    });
    pitchSlider.addEventListener('input', () => {
        pitchVal.innerText = parseFloat(pitchSlider.value).toFixed(2);
    });

    function startRecordingAndSpeak() {
        const text = textarea.value.trim();
        if (!text) {
            statusDiv.innerText = "⚠️ ദയവായി മലയാളത്തിൽ എന്തെങ്കിലും ടൈപ്പ് ചെയ്യുക!";
            return;
        }

        if (synthesis.speaking) synthesis.cancel();
        fallbackPlayer.pause();

        const selectedMode = voiceSelect.value;

        if (selectedMode && selectedMode.startsWith('native_')) {
            // Native Browser TTS
            const voiceName = selectedMode.replace('native_', '');
            const voiceList = synthesis.getVoices();
            let selectedVoice = voiceList.find(v => v.name === voiceName);
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ml-IN';
            utterance.rate = parseFloat(rateSlider.value);
            utterance.pitch = parseFloat(pitchSlider.value);
            if (selectedVoice) utterance.voice = selectedVoice;
            
            statusDiv.innerText = "🔊 സംസാരിക്കുന്നു (Native)...";
            utterance.onend = () => statusDiv.innerText = "✅ സംസാരം പൂർത്തിയായി.";
            synthesis.speak(utterance);
        } else {
            // Online Fallback API via HTML element to prevent Auto-play block
            statusDiv.innerText = "🌐 ഓൺലൈൻ ശബ്ദം തയ്യാറാക്കുന്നു...";
            
            // Limit characters for URL format (Google rejects very long text)
            let shortText = text.length > 200 ? text.substring(0, 200) : text;
            
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ml&client=tw-ob&q=${encodeURIComponent(shortText)}`;
            
            fallbackPlayer.src = url;
            fallbackPlayer.playbackRate = parseFloat(rateSlider.value);
            
            let playPromise = fallbackPlayer.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    statusDiv.innerText = "🔊 സംസാരിക്കുന്നു (Online)...";
                }).catch(err => {
                    console.error("Audio block error: ", err);
                    statusDiv.innerHTML = `❌ ബ്രൗസർ തടഞ്ഞു. <a href="${url}" target="_blank" style="color: #b44332; font-weight: bold; text-decoration: underline;">ഇവിടെ ക്ലിക്ക് ചെയ്ത് കേൾക്കുക/ഡൗൺലോഡ് ചെയ്യുക 📥</a>`;
                });
            }

            fallbackPlayer.onended = () => {
                statusDiv.innerText = "✅ സംസാരം പൂർത്തിയായി.";
            };
        }
    }

    // Download Functionality
    downloadBtn.addEventListener('click', () => {
        const text = textarea.value.trim();
        if (!text) {
            statusDiv.innerText = "⚠️ ഡൗൺലോഡ് ചെയ്യാൻ മലയാളത്തിൽ എന്തെങ്കിലും ടൈപ്പ് ചെയ്യുക!";
            return;
        }

        statusDiv.innerText = "⏳ ഡൗൺലോഡ് ലിങ്ക് തയ്യാറാക്കുന്നു...";
        let shortText = text.length > 200 ? text.substring(0, 200) : text;
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ml&client=tw-ob&q=${encodeURIComponent(shortText)}`;
        
        window.open(url, '_blank');
        statusDiv.innerText = "✅ പുതിയ ടാബിൽ തുറന്നു. 3 ഡോട്ടിൽ (⋮) ക്ലിക്ക് ചെയ്ത് Download ചെയ്യാം.";
    });

    speakRecordBtn.addEventListener('click', startRecordingAndSpeak);

    stopBtn.addEventListener('click', () => {
        if (synthesis.speaking) synthesis.cancel();
        fallbackPlayer.pause();
        statusDiv.innerText = "⏹️ സംസാരം നിർത്തി.";
    });
</script>
</body>
</html>
