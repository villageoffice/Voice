<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Native Malayalam Voice Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Noto Sans Malayalam', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #eef2fa 0%, #dce5f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .main-card {
            max-width: 980px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 56px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(110, 140, 160, 0.2);
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .header {
            background: linear-gradient(115deg, #0a2b38, #1c5a6e);
            padding: 28px 32px;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 span {
            background: linear-gradient(135deg, #ffe5b4, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            background: rgba(255, 255, 200, 0.2);
            border-radius: 60px;
            display: inline-block;
            padding: 5px 14px;
            font-size: 0.7rem;
            margin-top: 10px;
            font-weight: 500;
        }

        .content {
            padding: 28px 32px 36px;
        }

        .text-area {
            margin-bottom: 30px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1f4e66;
        }

        textarea {
            width: 100%;
            border: 2px solid #cde0ea;
            border-radius: 32px;
            padding: 16px 20px;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            background: white;
            font-weight: 500;
        }

        textarea:focus {
            border-color: #2c7da0;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .example-btn {
            background: #eef2f7;
            border: none;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1d5e7c;
            cursor: pointer;
            transition: 0.2s;
        }

        .example-btn:hover {
            background: #dae7f0;
            transform: scale(0.96);
        }

        .controls-panel {
            background: #f8fbfe;
            border-radius: 48px;
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid #e2edf4;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #134b62;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-left: 5px solid #f4a261;
            padding-left: 18px;
        }

        .voice-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .voice-group {
            flex: 1;
            min-width: 160px;
        }

        .voice-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #4e788b;
            margin-bottom: 6px;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px 12px;
            border-radius: 48px;
            border: 1px solid #caddf0;
            background: white;
            cursor: pointer;
        }

        .value-hint {
            font-size: 0.7rem;
            background: #eef2f5;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 6px;
        }

        .button-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 24px 0 16px;
        }

        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #1e6f5c;
            color: white;
        }

        .btn-primary:hover {
            background: #0f5545;
        }

        .btn-download {
            background: #2a6b47;
            color: white;
        }

        .btn-stop {
            background: #b44332;
            color: white;
        }

        .recording-status {
            background: #eef3f7;
            border-radius: 48px;
            padding: 12px 20px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .status-text {
            font-size: 0.75rem;
            color: #2c6e8f;
            font-weight: 500;
        }

            padding: 8px 14px;
            border-radius
